pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit

pre-push:
  commands:
    typecheck:
      run: pnpm exec tsc --noEmit
    tests:
      run: pnpm exec vitest run
    changesets:
      run: node scripts/validate-changesets.js
