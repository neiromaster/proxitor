# proxitor v1 configuration example
#
# Copy this file to:
#   ~/.config/proxitor/config.yaml   (default XDG location)
#   ~/proxitor.config.yaml           (HOME shadows XDG; wizard warns)
#   ~/.proxitor.yaml
#
# Or pass --config <path> to proxitor start.
#
# Environment variables referenced in {env: NAME} must be set at startup.

version: 1

# Global plugins — run on every request
plugins:
  - normalize-volatile-system
  - cache-control:
      cacheControl: auto
      ttl: 1h
      rewriteBlockTtl: auto
  - session-id

# Provider configurations — the YAML key becomes the provider id
providers:
  # OpenAI-compatible provider
  openai:
    baseUrl: https://api.openai.com
    wireFormat: openai-chat
    auth:
      type: bearer
      credential: { env: OPENAI_API_KEY }

  # Anthropic Messages API
  anthropic:
    baseUrl: https://api.anthropic.com
    wireFormat: anthropic-messages
    auth:
      type: x-api-key
      credential: { env: ANTHROPIC_API_KEY }
    headers: { anthropic-version: '2023-06-01' }

  # Generic OpenAI-compatible provider (e.g. GLM, Qwen, etc.)
  glm:
    baseUrl: https://api.example.com
    wireFormat: openai-chat
    auth:
      type: bearer
      credential: { env: GLM_API_KEY }
    # Optional: extra headers for this provider
    # headers:
    #   x-custom: value
    # Optional: provider-level plugins
    # plugins:
    #   - disable: [cache-control]

# Model routing table — first match wins
models:
  # Route all claude-* models to GLM
  - match: 'claude-*'
    provider: glm
    modelId: '$MODEL'        # pass the logical name through unchanged
    # Optional: model-level plugins
    # plugins:
    #   - disable: [session-id]

  # Catch-all — everything else to OpenAI
  - match: '*'
    provider: openai
    modelId: '$MODEL'

# Default provider — serves model-less requests (embeddings, /v1/models)
defaultProvider: openai

# Server configuration
server:
  host: 127.0.0.1
  port: 8828
  bodyLimit: 50mb
  # Optional: forward these inbound headers to providers
  # forwardHeaders:
  #   - x-custom-api-key

# Control plane — required for /control/* endpoints
controlPlane:
  token: { env: PROXITOR_CONTROL_TOKEN }

# Observability — cache tracking and request classification
observability:
  routerMetadata: true        # capture provider routing metadata
  hitThreshold: 80           # cache read ≥ 80% → HIT (otherwise PARTIAL)
  sideMaxTokens: 4096        # small requests → [side] classification
  sessionMaxEntries: 4096     # session tracker capacity
  sessionTtlMs: 600000        # session tracker TTL (10 minutes)

# Logging
logging:
  verbose: false
